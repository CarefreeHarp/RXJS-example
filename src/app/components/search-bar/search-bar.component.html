<form class="card shadow-sm border-0 mb-4 search-card" (submit)="onSearch($event, username.value)">
  <div class="card-body p-3 p-md-4">
    <label class="form-label fw-semibold mb-1" for="username">Busca por nombre de usuario</label>
    <p class="small text-secondary mb-3">Prueba con <span class="fw-semibold">emilys</span> para ver un perfil de ejemplo.</p>
    <div class="input-group">
      <input #username id="username" class="form-control" name="username" type="text" placeholder="Ej. emilys">
      <button class="btn btn-primary px-4" type="submit">Buscar</button>
    </div>
  </div>
</form>
